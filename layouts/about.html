{{ define "main" }}
  {{/* centred title on the same coral wash as the home page banner */}}
  <section class="home-banner py-14">
    <div class="container text-center">
      <h1 class="section-title section-title-center text-h3 lg:text-h1">
        {{ .Title }}
      </h1>
    </div>
  </section>

  <section class="section-sm">
    <div class="container">
      <div class="row justify-center">
        <div class="md:col-10 lg:col-8">
          {{ if .Params.image }}
            {{ partial "image" (dict "Src" .Params.image "Context" .Page "Alt" .Title "Class" "mx-auto rounded mb-6" ) }}
          {{ end }}
          <div class="content home-text">{{ .Content }}</div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
